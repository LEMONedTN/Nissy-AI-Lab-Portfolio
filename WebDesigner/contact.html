<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Nissy AI Lab</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'brand-black': '#050505', 'brand-dark': '#121212', 'brand-gray': '#222222', 'brand-accent': '#B0C4DE', }, fontFamily: { sans: ['Inter', 'Noto Sans JP', 'sans-serif'], }, letterSpacing: { widest: '.2em', } } } }
    </script>

    <!-- 分離した外部CSSファイルの読み込み -->
    <link rel="stylesheet" href="style/reset.css">
    <link rel="stylesheet" href="style/style.css">
</head>

<body class="bg-brand-black text-white">

    <header class="fixed top-0 left-0 w-full z-50 bg-brand-black/90 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <h1 class="text-xl font-semibold tracking-wider"><a href="index.html">Nissy AI Lab</a></h1>
            <nav class="hidden md:block">
                <ul class="flex space-x-10 text-sm tracking-wider font-light">
                    <li><a href="index.html" class="hover-underline">Home</a></li>
                    <li><a href="about.html" class="hover-underline">About</a></li>
                    <li><a href="works.html" class="hover-underline">Works</a></li>
                    <li><a href="service.html" class="hover-underline">Service</a></li>
                    <li><a href="contact.html" class="hover-underline text-brand-accent">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="pt-32 pb-16 px-6 bg-brand-dark border-b border-white/5">
        <div class="max-w-7xl mx-auto text-center fade-in">
            <h2 class="text-4xl md:text-5xl font-light tracking-widest mb-4">Contact</h2>
            <p class="text-xs uppercase tracking-widest text-brand-accent">お問い合わせ</p>
        </div>
    </div>

    <section class="py-24 px-6 max-w-3xl mx-auto fade-in">
        <p class="text-center text-sm font-light leading-relaxed tracking-wider mb-12 text-gray-300">
            プロジェクトのご相談、お見積りのご依頼など、お気軽にお問い合わせください。<br>
            2営業日以内にご返信させていただきます。
        </p>

        <form action="#" method="POST" class="space-y-8">
            <div>
                <label for="name" class="block text-xs tracking-widest text-gray-400 mb-2">お名前 <span
                        class="text-brand-accent">*</span></label>
                <input type="text" id="name" name="name" required placeholder="山田 太郎"
                    class="w-full bg-brand-dark border border-white/10 text-white px-4 py-3 rounded-sm focus:outline-none focus:border-brand-accent transition-colors duration-300 placeholder:text-gray-600">
            </div>

            <div>
                <label for="email" class="block text-xs tracking-widest text-gray-400 mb-2">メールアドレス <span
                        class="text-brand-accent">*</span></label>
                <input type="email" id="email" name="email" required placeholder="info@example.com"
                    class="w-full bg-brand-dark border border-white/10 text-white px-4 py-3 rounded-sm focus:outline-none focus:border-brand-accent transition-colors duration-300 placeholder:text-gray-600">
            </div>

            <div>
                <label for="type" class="block text-xs tracking-widest text-gray-400 mb-2">ご用件</label>
                <select id="type" name="type"
                    class="w-full bg-brand-dark border border-white/10 text-white px-4 py-3 rounded-sm focus:outline-none focus:border-brand-accent transition-colors duration-300">
                    <option value="consult">Web制作のご相談・お見積り</option>
                    <option value="branding">ブランディングに関するご相談</option>
                    <option value="other">その他のお問い合わせ</option>
                </select>
            </div>

            <div>
                <label for="message" class="block text-xs tracking-widest text-gray-400 mb-2">メッセージ <span
                        class="text-brand-accent">*</span></label>
                <textarea id="message" name="message" rows="6" required placeholder="ご相談内容をご記入ください。"
                    class="w-full bg-brand-dark border border-white/10 text-white px-4 py-3 rounded-sm focus:outline-none focus:border-brand-accent transition-colors duration-300 placeholder:text-gray-600"></textarea>
            </div>

            <div class="text-center pt-8">
                <button type="submit"
                    class="bg-white text-brand-black px-16 py-4 text-sm tracking-widest font-medium hover:bg-brand-accent hover:text-white transition-colors duration-300">
                    送信する
                </button>
            </div>
        </form>
    </section>

    <footer class="bg-brand-black border-t border-white/10 py-12 px-6 mt-12">
        <div class="max-w-7xl mx-auto">
            <h2 class="text-lg font-medium tracking-widest mb-1">Nissy AI Lab</h2>
        </div>
    </footer>
</body>

</html>
