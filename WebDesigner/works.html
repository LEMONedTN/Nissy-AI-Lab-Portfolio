<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>

            theme: {
                extend: {

                        'brand-black': '#050505', 'brand-dark': '#121212', 'brand-gray': '#222222', 'brand-accent': '#B0C4DE',

                    fontFamily: { sans: ['Inter', 'Noto Sans JP', 'sans-serif'], },

    <!-- 分離した外部CSSファイルの読み込み -->

<body class="bg-brand-black text-white">

    <header
